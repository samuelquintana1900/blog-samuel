<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog do Samuel</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Segoe UI', sans-serif;
    }

    body{
        background: linear-gradient(135deg,#6a11cb,#2575fc);
        color:#333;
    }

    header{
        text-align:center;
        color:white;
        padding:60px 20px;
    }

    header h1{
        font-size:3rem;
        margin-bottom:10px;
    }

    header p{
        font-size:1.2rem;
        opacity:0.9;
    }

    .container{
        max-width:1100px;
        margin:auto;
        padding:30px;
    }

    .card{
        background:white;
        border-radius:20px;
        overflow:hidden;
        box-shadow:0 10px 30px rgba(0,0,0,0.2);
    }

    .card img{
        width:100%;
        height:450px;
        object-fit:cover;
    }

    .content{
        padding:30px;
    }

    .content h2{
        color:#2575fc;
        margin-bottom:15px;
    }

    .content p{
        line-height:1.8;
        margin-bottom:15px;
    }

    .tags{
        margin-top:20px;
    }

    .tag{
        display:inline-block;
        background:#2575fc;
        color:white;
        padding:8px 15px;
        border-radius:20px;
        margin-right:10px;
        margin-bottom:10px;
    }

    .btn{
        display:inline-block;
        margin-top:20px;
        background:#6a11cb;
        color:white;
        text-decoration:none;
        padding:12px 25px;
        border-radius:30px;
    }

    footer{
        text-align:center;
        color:white;
        padding:30px;
        margin-top:40px;
    }

    /* ❤️ / 👎 */
    .reactions{
        margin-top:20px;
        display:flex;
        align-items:center;
        gap:10px;
    }

    .like-btn, .dislike-btn{
        border:none;
        padding:10px 15px;
        border-radius:30px;
        cursor:pointer;
        color:white;
        font-size:16px;
        transition:0.3s;
    }

    .like-btn{
        background:#ff2e63;
    }

    .dislike-btn{
        background:#444;
    }

    .active-like{
        background:#b3003c !important;
    }

    .active-dislike{
        background:#000 !important;
    }

    .counter{
        font-weight:bold;
        margin-right:10px;
    }
</style>
</head>

<body>

<header>
    <h1>📱 Blog do Samuel</h1>
    <p>O mundo das capinhas de celular e muito estilo!</p>
</header>

<div class="container">

    <div class="card">
        <img src="https://photos.enjoei.com.br/kit-capinhas-celular-varios-modelos-43-capinhas-98721575/800x800/czM6Ly9waG90b3MuZW5qb2VpLmNvbS5ici9wcm9kdWN0cy8zNDkzMTc5NS8wZGZhMTY3NGUyYzYyZGJkNjJjNzA3MDQyYmMyYTE4ZC5qcGc">

        <div class="content">
            <h2>Capinhas: proteção com personalidade</h2>

            <p>Olá! Eu sou Samuel e adoro colecionar capinhas de celular.</p>

            <!-- REAÇÕES -->
            <div class="reactions">
                <button class="like-btn" id="likeBtn" onclick="like()">❤️ Curtir</button>
                <button class="dislike-btn" id="dislikeBtn" onclick="dislike()">👎 Deslike</button>

                <span class="counter">👍 <span id="likes">0</span></span>
                <span class="counter">👎 <span id="dislikes">0</span></span>
            </div>

            <a href="#" class="btn">Ver Mais Conteúdos</a>
        </div>
    </div>

</div>

<footer>
    © 2026 - Blog do Samuel | Feito com ❤️
</footer>

<script>
    let state = "none"; // none | like | dislike
    let likes = 0;
    let dislikes = 0;

    function updateUI(){
        document.getElementById("likes").textContent = likes;
        document.getElementById("dislikes").textContent = dislikes;

        const likeBtn = document.getElementById("likeBtn");
        const dislikeBtn = document.getElementById("dislikeBtn");

        likeBtn.classList.remove("active-like");
        dislikeBtn.classList.remove("active-dislike");

        if(state === "like"){
            likeBtn.classList.add("active-like");
        } 
        else if(state === "dislike"){
            dislikeBtn.classList.add("active-dislike");
        }
    }

    function like(){
        if(state === "like"){
            likes--;
            state = "none";
        } 
        else {
            if(state === "dislike") dislikes--;
            likes++;
            state = "like";
        }
        updateUI();
    }

    function dislike(){
        if(state === "dislike"){
            dislikes--;
            state = "none";
        } 
        else {
            if(state === "like") likes--;
            dislikes++;
            state = "dislike";
        }
        updateUI();
    }
</script>

</body>
</html>
